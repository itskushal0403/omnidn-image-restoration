# OmniDN-M (~11.4 GMACs @256²) — larger point on the FLOPs/quality Pareto curve.
# Stage 1: fidelity training on the full degradation mixture (Charbonnier + FFT), wall-clock cosine schedule.
name: omnidn_m_stage1
model:
  name: omnidn_m
data:
  batch_size: 32
  num_workers: 14
  patch: 256
  domain_weights: {natural: 0.55, medical: 0.33, lowlight: 0.12}
  darken_prob: 0.10
  gray_prob: 0.04
loss:
  charbonnier: 1.0
  fft: 0.05
train:
  lr: 6.0e-4
  betas: [0.9, 0.9]
  weight_decay: 0.0
  warmup_frac: 0.01
  min_lr_factor: 1.0e-3
  max_iters: 2000000        # effectively unlimited: the wall-clock budget ends the schedule
  time_budget_h: 20.0
  ema: 0.999
  grad_clip: 1.0
  compile: true
  ckpt_minutes: 20
  log_every: 200
val:
  data: data/val/proxy_test_v2
  limit: 300
  every: 2500
  dists_every: 10000
  snapshot_every: 25000
