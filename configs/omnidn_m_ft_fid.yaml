# Stage 2a — metric-aligned FIDELITY fine-tune of OmniDN-M.
# Loss = PSNR-loss (mean per-image 10·log10 MSE == -mean PSNR) + 30 * (1 - SSIM_skimage_exact)
#   (dB units: 0.01 SSIM is valued like 0.3 dB of PSNR). Starts from the stage-1 EMA weights.
name: omnidn_m_ft_fid
init: checkpoints/omnidn_m_stage1/ema_final.pth
model:
  name: omnidn_m
data:
  batch_size: 32
  num_workers: 14
  patch: 256
  domain_weights: {natural: 0.55, medical: 0.33, lowlight: 0.12}
  darken_prob: 0.10
  gray_prob: 0.04
  composer:   # stage 2: emphasise the families listed in the task PDF (JPEG, Gaussian noise, motion blur), halve the extras
    weights: {gaussian_noise: 0.25, jpeg: 0.18, motion_blur: 0.09, defocus_blur: 0.07, gaussian_blur: 0.11,
              banding_noise: 0.01, chroma_noise: 0.01, rician_noise: 0.015, correlated_noise: 0.02, posterize: 0.008,
              ringing: 0.01, small_artifacts: 0.01, webp: 0.01, pixelate: 0.008}
loss:
  charbonnier: 0.0
  psnr: 1.0
  ssim: 30.0
train:
  lr: 6.0e-5
  betas: [0.9, 0.99]
  warmup_frac: 0.02
  min_lr_factor: 1.0e-2
  max_iters: 2000000
  time_budget_h: 1.5
  ema: 0.999
  grad_clip: 5.0
  compile: true
  ckpt_minutes: 15
  log_every: 200
val:
  data: data/val/proxy_test_v2
  every: 2000
  dists_every: 4000
  snapshot_every: 1000000
